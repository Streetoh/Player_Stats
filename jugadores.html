<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060a13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Portal oficial del jugador: estadísticas, convocatorias, asistencia en vivo y comparativas Face to Face" />
  <title>Player stats (Player)</title>
  <link rel="manifest" href="manifest_jugadores.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* Estilos específicos y corrección de scroll del Portal de Jugadores */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: var(--bg);
      color: var(--text);
      touch-action: pan-y !important;
      -webkit-user-select: none;
      user-select: none;
    }
    #app {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
    }
    .player-portal-header {
      flex-shrink: 0 !important;
      background: linear-gradient(180deg, rgba(19, 31, 56, 0.98) 0%, rgba(6, 10, 19, 0.95) 100%);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #portal-view {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      padding: 10px 14px 140px !important;
      overscroll-behavior-y: contain;
    }
    .tabbar {
      position: fixed !important;
      left: 12px !important;
      right: 12px !important;
      bottom: calc(10px + env(safe-area-inset-bottom)) !important;
      z-index: 999 !important;
      height: var(--tabbar-h) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-around !important;
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--dim);
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.18s;
      user-select: none;
    }
    .tab-btn.active {
      color: var(--cyan);
    }
    .tab-btn .t-ic {
      position: relative;
      font-size: 17px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tab-badge-dot {
      position: absolute;
      top: -2px;
      right: -6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      border: 1.5px solid var(--surface);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.9);
      animation: pulseTabDot 1.8s infinite ease-in-out;
    }
    @keyframes pulseTabDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.85; }
    }
    .tab-btn .t-lbl {
      font-size: 10px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .portal-identity-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    /* Brillo llamativo y reborde en movimiento cuando no hay perfil seleccionado */
    @keyframes attentionBorderFlow {
      0% {
        box-shadow: 0 0 0 2px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.65);
        border-color: #38bdf8;
      }
      50% {
        box-shadow: 0 0 0 3.5px #06b6d4, 0 0 28px rgba(6, 182, 212, 0.95), inset 0 0 16px rgba(6, 182, 212, 0.28);
        border-color: #22d3ee;
      }
      100% {
        box-shadow: 0 0 0 2px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.65);
        border-color: #38bdf8;
      }
    }
    @keyframes attentionPulseBtn {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
        border-color: #38bdf8;
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 22px rgba(34, 211, 238, 1);
        border-color: #22d3ee;
      }
    }
    .portal-identity-bar.attention-glow {
      animation: attentionBorderFlow 1.8s infinite ease-in-out !important;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.22) 0%, rgba(14, 165, 233, 0.28) 100%) !important;
      border: 2px solid #38bdf8 !important;
    }
    .portal-identity-bar.attention-glow #portal-lbl-change {
      animation: attentionPulseBtn 1.8s infinite ease-in-out !important;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%) !important;
      color: #ffffff !important;
      border: 2px solid #38bdf8 !important;
      font-weight: 900 !important;
    }
    .portal-identity-bar.attention-glow #portal-my-name {
      color: #7dd3fc !important;
      font-weight: 900 !important;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }
    .portal-vote-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
    }
    .portal-vote-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-vote {
      height: 48px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-vote:active { transform: scale(0.96); }
    .btn-vote.yes {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.5);
      color: #86efac;
    }
    .btn-vote.yes.active {
      background: #22c55e;
      color: #04140a;
      box-shadow: 0 4px 18px rgba(34, 197, 94, 0.4);
    }
    .btn-vote.no {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    .btn-vote.no.active {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Barra superior fija del Portal -->
    <header class="player-portal-header">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="icons/club-logo.png" style="width: 28px; height: 28px; object-fit: contain; border-radius: 50%;" alt="Club Logo" onerror="this.outerHTML='<span style=\'font-size: 22px;\'>🛡️</span>'">
          <div>
            <h1 style="margin: 0; font-size: 16px; font-weight: 900; letter-spacing: -0.3px;" id="portal-club-title">Player Stats</h1>
            <span style="font-size: 11px; color: var(--cyan); font-weight: 700;">PLAYER STATS (PLAYER)</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button class="icon-btn" id="btn-portal-lang" style="width: 34px; height: 34px; font-weight: 900; font-size: 12px;">EN</button>
          <span class="badge" id="portal-cloud-badge" style="background: rgba(34, 197, 94, 0.15); color: #86efac; font-size: 10.5px;">🟢 Live</span>
        </div>
      </div>

      <!-- Selector de identidad: ¿Quién soy? -->
      <div class="portal-identity-bar" id="portal-identity-container" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: default;">
        <div id="portal-my-info-btn" style="display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; cursor: pointer;" title="My Profile">
          <div id="portal-my-avatar" class="avatar sm"><span>?</span></div>
          <div style="overflow: hidden;">
            <div style="font-size: 11px; color: var(--muted); font-weight: 700;" id="portal-lbl-profile">My Profile:</div>
            <div style="font-size: 14px; font-weight: 800; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" id="portal-my-name">
              Select who you are...
            </div>
          </div>
        </div>
        <button type="button" class="btn sm" id="portal-lbl-change" style="font-size: 11.5px; font-weight: 800; flex-shrink: 0; padding: 4px 10px; border-radius: 8px; cursor: pointer; background: rgba(6, 182, 212, 0.15); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.3);">Change ▾</button>
      </div>
    </header>

    <!-- Contenido principal según pestaña activa -->
    <main id="portal-view"></main>

    <!-- Barra de navegación inferior -->
    <nav class="tabbar" id="portal-tabbar">
      <button class="tab-btn active" data-tab="convocations">
        <span class="t-ic">📋<span class="tab-badge-dot" id="convocations-tab-dot" style="display:none;"></span></span>
        <span class="t-lbl">Call-ups</span>
      </button>
      <button class="tab-btn" data-tab="stats">
        <span class="t-ic">👤</span>
        <span class="t-lbl">My Profile</span>
      </button>
      <button class="tab-btn" data-tab="squad">
        <span class="t-ic">👥</span>
        <span class="t-lbl">Squad</span>
      </button>
      <button class="tab-btn" data-tab="h2h">
        <span class="t-ic">⚔️</span>
        <span class="t-lbl">Face to Face</span>
      </button>
      <button class="tab-btn" data-tab="chat">
        <span class="t-ic">💬</span>
        <span class="t-lbl">Chat</span>
      </button>
    </nav>
  </div>

  <div id="toast-root"></div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-app-compat.js"></script>
  <script src="js/firebase-firestore-compat.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/player-app.js"></script>
</body>
</html>
