<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Confirmación de Convocatoria • Estadísticas Jugadores</title>
  <style>
    :root {
      --bg: #060a13;
      --bg2: #0d1527;
      --surface: #131f38;
      --surface2: #1c2c4e;
      --border: #223456;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #22d3ee;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(34, 211, 238, 0.15); color: var(--cyan); border: 1px solid rgba(34, 211, 238, 0.3); margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .field { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); color: #fff; font-size: 15px; font-weight: 700; outline: none; }
    input:focus, select:focus { border-color: var(--cyan); }
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .choice-btn { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface2); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.15s; }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn.yes { border-color: rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.12); color: #86efac; }
    .choice-btn.doubt { border-color: rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.12); color: #fde047; }
    .choice-btn.no { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.12); color: #fca5a5; }
    .foot { margin-top: 20px; font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center;">
      <span class="badge" id="c-badge">CONVOCATORIA OFICIAL</span>
      <h1 id="c-title">Partido vs Rival</h1>
      <div class="meta" id="c-meta">📅 Fecha • ⏰ Hora • 📍 Campo</div>
    </div>

    <div class="field">
      <label for="player-name">Selecciona tu nombre o escríbelo:</label>
      <input type="text" id="player-name" list="players-datalist" placeholder="Ej: Juan Pérez (#10)" autocomplete="off" />
      <datalist id="players-datalist"></datalist>
      <div id="fuzzy-suggestion" style="display: none; margin-top: 6px; font-size: 12px; background: rgba(34, 211, 238, 0.12); border: 1px dashed var(--cyan); padding: 7px 10px; border-radius: 10px; color: #bae6fd; cursor: pointer;">
        💡 ¿Quisiste decir: <b id="fuzzy-name" style="text-decoration: underline; color: #fff;"></b>? <span style="color: var(--cyan);">(Toca aquí para seleccionar)</span>
      </div>
    </div>

    <div class="field">
      <label for="player-notes">Comentario / Motivo (opcional):</label>
      <input type="text" id="player-notes" placeholder="Ej: Llego 10 min antes / Coche propio..." />
    </div>

    <div style="font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 14px;">CONFIRMA TU ASISTENCIA / CONFIRM ATTENDANCE:</div>
    <div class="choices">
      <button class="choice-btn yes" onclick="handleChoice('yes')">
        <span>🟢 Yes • Attending / Asistiré</span>
        <span>✓</span>
      </button>
      <button class="choice-btn no" onclick="handleChoice('no')">
        <span>❌ No • Not attending / Baja</span>
        <span>✕</span>
      </button>
    </div>

    <div id="send-channels" style="display: none; margin-top: 16px; background: var(--bg2); padding: 14px; border-radius: 14px; border: 1px solid var(--border);">
      <div id="copy-status-badge" style="font-size: 12px; font-weight: 800; color: #86efac; margin-bottom: 6px;">
        ✅ ¡Copiado al portapapeles! / Copied to clipboard!
      </div>
      <div id="msg-preview-box" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 12px; color: #e2e8f0; white-space: pre-wrap; font-family: monospace; max-height: 120px; overflow-y: auto; margin-bottom: 10px; text-align: left;"></div>
      <div style="display: flex; gap: 8px; flex-direction: column;">
        <button type="button" class="choice-btn doubt" id="btn-viber-open" style="width: 100%; padding: 12px; justify-content: center; gap: 8px; border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.2); color: #d8b4fe;" onclick="sendVia('viber')">
          <span>💜 Abrir Viber</span>
        </button>
        <button type="button" class="choice-btn" id="btn-copy-again" style="width: 100%; padding: 10px; justify-content: center; gap: 8px; font-size: 13px; border-color: var(--border); background: var(--surface2); color: #fff;" onclick="copyCurrentMessage()">
          <span>📋 Copiar mensaje completo</span>
        </button>
      </div>
    </div>

    <div class="foot">
      ⚽ Estadísticas Jugadores • Sistema de Gestión de Plantilla
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('t') || params.get('title') || 'Match Convocation';
    const team = params.get('tm') || params.get('team') || '';
    const rival = params.get('r') || params.get('rival') || '';
    const date = params.get('d') || params.get('date') || '';
    const time = params.get('h') || params.get('time') || '';
    const venue = params.get('v') || params.get('venue') || '';
    const playersParam = params.get('p') || params.get('players') || '';
    const lang = (params.get('lang') || 'es').toLowerCase();
    const isEn = (lang === 'en');

    if (isEn) {
      document.getElementById('c-badge').textContent = 'OFFICIAL CALL-UP';
      const lblName = document.querySelector('label[for="player-name"]');
      if (lblName) lblName.textContent = 'Select or type your name:';
      const inpName = document.getElementById('player-name');
      if (inpName) inpName.placeholder = 'e.g. John Smith (#10)';
      const lblNotes = document.querySelector('label[for="player-notes"]');
      if (lblNotes) lblNotes.textContent = 'Comments / Notes (optional):';
      const inpNotes = document.getElementById('player-notes');
      if (inpNotes) inpNotes.placeholder = 'e.g. Arriving 10 min early / own transport...';
      const foot = document.querySelector('.foot');
      if (foot) foot.textContent = '⚽ Player Stats • Squad Attendance System';
    }

    const squadList = playersParam ? playersParam.split(',').map(s => s.trim()).filter(Boolean) : [];

    let matchDisplay = '';
    if (team && rival) {
      matchDisplay = `${team} vs ${rival}`;
    } else if (rival) {
      matchDisplay = `${title} vs ${rival}`;
    } else {
      matchDisplay = title;
    }
    document.getElementById('c-title').textContent = matchDisplay;

    const metaParts = [];
    if (team) metaParts.push(`🛡️ ${team}`);
    if (date) metaParts.push(`📅 ${date}`);
    if (time) metaParts.push(`⏰ ${time}`);
    if (venue) metaParts.push(`📍 ${venue}`);
    document.getElementById('c-meta').textContent = metaParts.join(' • ') || (isEn ? 'Match Details' : 'Detalles del evento');

    if (squadList.length > 0) {
      const dl = document.getElementById('players-datalist');
      squadList.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        dl.appendChild(opt);
      });
    }

    // Algoritmo de similitud Levenshtein para sugerir nombres mal escritos
    function levenshtein(a, b) {
      const al = a.length, bl = b.length;
      if (!al) return bl;
      if (!bl) return al;
      const matrix = Array.from({ length: al + 1 }, () => new Array(bl + 1).fill(0));
      for (let i = 0; i <= al; i++) matrix[i][0] = i;
      for (let j = 0; j <= bl; j++) matrix[0][j] = j;
      for (let i = 1; i <= al; i++) {
        for (let j = 1; j <= bl; j++) {
          const cost = a[i - 1].toLowerCase() === b[j - 1].toLowerCase() ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[al][bl];
    }

    const inputName = document.getElementById('player-name');
    const suggBox = document.getElementById('fuzzy-suggestion');
    const suggName = document.getElementById('fuzzy-name');

    inputName.addEventListener('input', () => {
      const val = inputName.value.trim().toLowerCase();
      if (!val || val.length < 2 || squadList.length === 0) {
        suggBox.style.display = 'none';
        return;
      }
      const exact = squadList.find(s => s.toLowerCase() === val);
      if (exact) {
        suggBox.style.display = 'none';
        return;
      }

      // Buscar el jugador más parecido
      let best = null, bestDist = 999;
      squadList.forEach(p => {
        const pClean = p.toLowerCase().replace(/#\d+\s*/g, '').trim();
        const dist = levenshtein(val, pClean);
        if (dist < bestDist && dist <= Math.max(2, Math.floor(val.length * 0.45))) {
          bestDist = dist;
          best = p;
        }
      });

      if (best) {
        suggName.textContent = best;
        suggBox.style.display = 'block';
        suggBox.onclick = () => {
          inputName.value = best;
          suggBox.style.display = 'none';
        };
      } else {
        suggBox.style.display = 'none';
      }
    });

    let currentSelectedStatus = 'yes';
    let lastGeneratedMsg = '';

    function buildConfirmationMessage() {
      const name = inputName.value.trim();
      const notes = document.getElementById('player-notes').value.trim();
      const isAttending = currentSelectedStatus === 'yes';
      const statusText = isAttending 
        ? (isEn ? '🟢 ATTENDING (YES)' : '🟢 CONFIRMO ASISTENCIA (SÍ)') 
        : (isEn ? '❌ NOT ATTENDING (NO)' : '❌ NO PUEDO ASISTIR (NO)');

      const matchStr = matchDisplay || (rival ? `vs ${rival}` : title);
      const metaItems = [];
      if (date) metaItems.push(date);
      if (time) metaItems.push(time);
      if (venue) metaItems.push(venue);
      const metaLine = metaItems.join(' • ');

      let msg = (isEn ? `📋 *Match Attendance Confirmation*\n` : `📋 *Confirmación de Convocatoria*\n`);
      msg += (isEn ? `👤 *Player:* ${name}\n` : `👤 *Jugador:* ${name}\n`);
      msg += (isEn ? `📢 *Status:* ${statusText}\n` : `📢 *Estado:* ${statusText}\n`);
      if (matchStr) msg += (isEn ? `🏆 *Match:* ${matchStr}\n` : `🏆 *Partido:* ${matchStr}\n`);
      if (metaLine) msg += (isEn ? `📅 *Info:* ${metaLine}\n` : `📅 *Datos:* ${metaLine}\n`);
      if (notes) msg += (isEn ? `📝 *Notes:* ${notes}\n` : `📝 *Notas:* ${notes}\n`);
      msg += (isEn ? `\n⚽ _Player Stats_` : `\n⚽ _Estadísticas Jugadores_`);

      lastGeneratedMsg = msg;
      return msg;
    }

    function copyCurrentMessage() {
      const msg = lastGeneratedMsg || buildConfirmationMessage();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(() => {
          alert(isEn ? 'Message copied to clipboard! You can paste it into Viber.' : '¡Mensaje copiado al portapapeles! Puedes pegarlo en el grupo de Viber.');
        }).catch(() => {});
      }
    }

    function handleChoice(status) {
      const name = inputName.value.trim();
      if (!name) {
        alert(isEn ? 'Please enter or select your name first.' : 'Por favor, selecciona o introduce tu nombre antes de confirmar.');
        inputName.focus();
        return;
      }
      currentSelectedStatus = status;

      const msg = buildConfirmationMessage();

      // Copiar automáticamente al portapapeles
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).catch(() => {});
      }

      const previewBox = document.getElementById('msg-preview-box');
      if (previewBox) {
        previewBox.textContent = msg;
      }

      const sendDiv = document.getElementById('send-channels');
      sendDiv.style.display = 'block';
      sendDiv.scrollIntoView({ behavior: 'smooth' });

      sendVia('viber');
    }

    function sendVia(channel) {
      const msg = lastGeneratedMsg || buildConfirmationMessage();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).catch(() => {});
      }

      const viberUrl = `viber://forward?text=${encodeURIComponent(msg)}`;
      window.location.href = viberUrl;
      setTimeout(() => {
        window.open(viberUrl, '_blank');
      }, 400);
    }
  </script>
</body>
</html>
