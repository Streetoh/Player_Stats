<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Confirmación de Convocatoria • Estadísticas Jugadores</title>
  <style>
    :root {
      --bg: #060a13;
      --bg2: #0d1527;
      --surface: #131f38;
      --surface2: #1c2c4e;
      --border: #223456;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #22d3ee;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(34, 211, 238, 0.15); color: var(--cyan); border: 1px solid rgba(34, 211, 238, 0.3); margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .field { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); color: #fff; font-size: 15px; font-weight: 700; outline: none; }
    input:focus, select:focus { border-color: var(--cyan); }
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .choice-btn { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface2); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.15s; }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn.yes { border-color: rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.12); color: #86efac; }
    .choice-btn.doubt { border-color: rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.12); color: #fde047; }
    .choice-btn.no { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.12); color: #fca5a5; }
    .foot { margin-top: 20px; font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center;">
      <span class="badge" id="c-badge">CONVOCATORIA OFICIAL</span>
      <h1 id="c-title">Partido vs Rival</h1>
      <div class="meta" id="c-meta">📅 Fecha • ⏰ Hora • 📍 Campo</div>
    </div>

    <div class="field">
      <label for="player-name">Selecciona tu nombre o escríbelo:</label>
      <input type="text" id="player-name" list="players-datalist" placeholder="Ej: Juan Pérez (#10)" />
      <datalist id="players-datalist"></datalist>
    </div>

    <div class="field">
      <label for="player-notes">Comentario / Motivo (opcional):</label>
      <input type="text" id="player-notes" placeholder="Ej: Llego 10 min antes / Coche propio..." />
    </div>

    <div style="font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 14px;">CONFIRMA TU ASISTENCIA:</div>
    <div class="choices">
      <button class="choice-btn yes" onclick="submitAttendance('🟢 CONFIRMO ASISTENCIA')">
        <span>🟢 Asistiré a la convocatoria</span>
        <span>✓</span>
      </button>
      <button class="choice-btn doubt" onclick="submitAttendance('🟡 DUDA / PENDIENTE')">
        <span>🟡 Duda / Pendiente</span>
        <span>?</span>
      </button>
      <button class="choice-btn no" onclick="submitAttendance('❌ NO PUEDO ASISTIR')">
        <span>❌ No podré asistir (Baja)</span>
        <span>✕</span>
      </button>
    </div>

    <div class="foot">
      ⚽ Estadísticas Jugadores • Sistema de Gestión de Plantilla
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'Convocatoria';
    const date = params.get('date') || '';
    const time = params.get('time') || '';
    const venue = params.get('venue') || '';
    const rival = params.get('rival') || '';
    const playersParam = params.get('players') || '';

    document.getElementById('c-title').textContent = title + (rival ? ' vs ' + rival : '');
    document.getElementById('c-meta').textContent = `${date ? '📅 ' + date : ''} ${time ? '• ⏰ ' + time : ''} ${venue ? '• 📍 ' + venue : ''}`.trim();

    if (playersParam) {
      const dl = document.getElementById('players-datalist');
      playersParam.split(',').forEach(p => {
        const name = p.trim();
        if (name) {
          const opt = document.createElement('option');
          opt.value = name;
          dl.appendChild(opt);
        }
      });
    }

    function submitAttendance(status) {
      const name = document.getElementById('player-name').value.trim();
      const notes = document.getElementById('player-notes').value.trim();
      if (!name) {
        alert('Por favor, introduce tu nombre para confirmar.');
        return;
      }

      const msg = `📋 *Confirmación de Convocatoria*\n` +
        `👤 *Jugador:* ${name}\n` +
        `📢 *Estado:* ${status}\n` +
        `🏆 *Evento:* ${title}${rival ? ' vs ' + rival : ''}\n` +
        `${date ? '📅 *Fecha:* ' + date : ''} ${time ? '• ⏰ ' + time : ''}\n` +
        `${notes ? '📝 *Comentario:* ' + notes + '\n' : ''}\n` +
        `⚽ _Enviado desde Estadísticas Jugadores_`;

      const waUrl = `whatsapp://send?text=${encodeURIComponent(msg)}`;
      window.location.href = waUrl;
      setTimeout(() => {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
      }, 500);
    }
  </script>
</body>
</html>
