<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=jugadores.html" />
  <meta name="theme-color" content="#060a13" />
  <title>Player stats</title>
  <link rel="manifest" href="manifest_jugadores.json" />
  <script>
    (function () {
      var search = window.location.search || '';
      var params = new URLSearchParams(search);
      // Si se solicita explícitamente modo coach mediante ?coach o desde la app Android Coach en localhost
      if (params.has('coach') || (window.AndroidBridge && (location.hostname === 'localhost' || location.hostname === '127.0.0.1'))) {
        window.location.replace('coach.html' + search);
      } else if (params.has('tracker') || params.has('c') || params.has('code') || params.has('join')) {
        window.location.replace('tracker.html' + search);
      } else {
        // Redirigir por defecto al portal de jugadores
        window.location.replace('jugadores.html' + search);
      }
    })();
  </script>
  <style>
    body {
      background: #060a13;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    a { color: #22d3ee; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <p style="font-size: 16px; margin-bottom: 12px; color: #f8fafc;">⚽ Redirigiendo al Portal de Jugadores...</p>
    <p style="font-size: 13px;"><a href="jugadores.html">Pulsa aquí si no redirige automáticamente</a></p>
  </div>
</body>
</html>
